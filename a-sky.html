<!-- PAC3: Tutorial d'A-FRAME 360º // REALITAT VIRTUAL -->
 <!-- Erica Meseguer Cava -->

<html>
    <head>
        <title>Sky</title>
        <meta name="description" content="Sky">
         <script src="https://aframe.io/releases/0.6.1/aframe.min.js"></script>         
    </head>

    <body>
        <a-scene>
            <a-assets>
                <img id="cubs" src="Recursos/pexels-amar-35483494.jpg">
            </a-assets>

            <a-sky id="image-360" radius="10" src="#cubs"></a-sky>

            <a-sphere id="index" position="-8 1 4" radius="0.25" color="purple">
               <a-animation attribute="scale" begin="mouseenter" direction="alternate" repeat= "10" dur="500" to="1.5 1.5 1.5"></a-animation>                             
            </a-sphere>
            <a-text value="Index" position="-7.5 1.8 4" scale="1.5 1.5 1.5" color="white" rotation="0 160 0"></a-text>  
            <a-link href="Index.html" title=" " position="-8 1.5 4" rotation="0 -50 0" scale="0.1 0.1 0.1"></a-link>

             <a-sphere id="ciutat" position="-8 1 -2" radius="0.25" color="black">
               <a-animation attribute="scale" begin="mouseenter" direction="alternate" repeat= "10" dur="500" to="1.5 1.5 1.5"></a-animation>                             
            </a-sphere>
            <a-text value="Ciutat-Videosphere" position="-9.5 1.8 -1" scale="1.5 1.5 1.5" color="white" rotation="0 60 0"></a-text>  
            <a-link href="a-videosphere.html" title=" " position="-8 1.5 -2" rotation="0 70 0" scale="0.1 0.1 0.1"></a-link>

            <a-camera rotation="0 90 0">
                <a-cursor color="red"></a-cursor>
            </a-camera>
        </a-scene>
    </body>
</html>
